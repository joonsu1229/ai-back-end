logging:
  level:
    p6spy: INFO
    org.hibernate: INFO
    org.springframework: INFO
    com.ai.hybridsearch: DEBUG

langchain:
  model-type: ${MODEL_TYPE}
  target-dimensions: ${TARGET_DIMENSIONS}

  # OpenAI 설정
  openai:
    api-key: ${OPENAI_API_KEY}
    embedding-model: text-embedding-3-small  # 임베딩용
    ai-chat-model: gpt-4                     # AI 추출용
    output-max-token: "4000"
    input-max-token: "8000"

  # Google Gemini 설정
  gemini:
    api-key: ${GEMINI_API_KEY}
    embeddingModel: ${GEMINI_API_EMBED_MODEL}
    aiChatModel: ${GEMINI_API_CHAT_MODEL}    # 또는 gemini-1.5-pro
    inputMaxToken: 1048576    # 약 100만 토큰 (최대)
    outputMaxToken: 8192      # 최대 출력

  # Anthropic Claude 설정 (AI 추출 전용)
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}
    ai-chat-model: claude-3-sonnet-20240229
    output-max-token: "4096"
    input-max-token: "100000"

  embedding:
    embeddingModel: all-minilm-l6-v2
    aiChatModel: gemini-1.5-flash    # 또는 gemini-1.5-pro
    inputMaxToken: 1048576    # 약 100만 토큰 (최대)
    outputMaxToken: 8192      # 최대 출력

crawling:
  detail-fetch-method: ${CRAWLING_DETAIL_FETCH_METHOD:selenium} # selenium 또는 scrapingbee
  insecure-skip-tls-verify: ${CRAWLING_INSECURE_SKIP_TLS_VERIFY:false}
  scraper-api:
    api-key: ${CRAWLING_SCRAPERAPI_KEY}
    api-url: ${CRAWLING_SCRAPERAPI_URL:https://api.scraperapi.com}
    js-rendering: ${CRAWLING_SCRAPERAPI_JS_RENDERING:false}
  scraping-bee:
    api-key: ${CRAWLING_SCRAPINGBEE_KEY}
    api-url: ${CRAWLING_SCRAPINGBEE_URL:https://app.scrapingbee.com/api/v1}
    premium-proxy: ${CRAWLING_SCRAPINGBEE_PREMIUM:false}
    country-code: ${CRAWLING_SCRAPINGBEE_COUNTRY:us}
